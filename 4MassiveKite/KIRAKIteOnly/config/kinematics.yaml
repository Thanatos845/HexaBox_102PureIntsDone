kinematics:
  incoming_momenta: [p1,p2,p3,p4]
  outgoing_momenta: []
  momentum_conservation: [p4,-p1-p2-p3]
  kinematic_invariants:
     - [s, 2]
     - [t, 2]
     - [mt2, 2]
     - [s12, 2]
     - [s34, 2]
  scalarproduct_rules:
     - [[p1,p1], s12]
     - [[p2,p2], s34]
     - [[p3,p3], mt2]
     - [[p1,p2], 1/2*(s - s12 - s34)]
     - [[p2,p3], 1/2*(-mt2 - s34 + t)]
     - [[p1,p3], 1/2*(mt2 - s + s34 - t)]
