integralfamilies:
  - name: "KITE"
    loop_momenta: [k1,k2]
    top_level_sectors: [b111110000]
    permutation_option: 1
    propagators:
      - [ "k1", 0]
      - [ "k1 + p1", 0]
      - [ "k2 - k1 - p3 - p2 - p1", 0]
      - [ "k2 - p3", 0]
      - [ "k2", mt2]
      - [ "k1+p2", 0]
      - [ "k1+p3", 0]
      - [ "k2+p1", 0]
      - [ "k2+p2", 0]